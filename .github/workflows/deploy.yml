# Rare Advance — build and deploy to GitHub Pages.
#
# The VITE_ values are PUBLIC and deliberately non-secret:
#   VITE_OPENSEA_API_KEY is a low-privilege, rotatable demo key used only to read
#   public NFT artwork. It cannot move anything and is never used for ownership
#   or for any economic figure.
name: Deploy Rare Advance to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_OPENSEA_API_KEY: ${{ vars.VITE_OPENSEA_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
